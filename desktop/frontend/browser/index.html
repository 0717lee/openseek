<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- interactive-widget makes Chrome shrink the layout viewport when the
         on-screen keyboard opens, so the flex shell compresses (topbar stays,
         composer sits above the keyboard) instead of the whole page panning
         up. Safari ignores the key. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content"
    />
    <title>OpenSeek Console</title>
    <!-- The embedded code viewer's styles, assembled from the editor
         dependency by the packager (see build_viewer_stylesheet). -->
    <link rel="stylesheet" href="viewer.css" />
    <!-- The app's own stylesheet, shared with the desktop window
         (desktop/index.html). -->
    <link rel="stylesheet" href="app.css" />
    <!-- Generated from the same pinned xterm sources as the desktop bundle.
         The browser packager must ship both sidecars next to this page. -->
    <link rel="stylesheet" href="xterm.css" />
  </head>
  <body>
    <div id="app"></div>
    <!-- Defines __openseek_xterm before the MoonBit frontend mounts a
         terminal emulator. The PTY itself remains on the selected host. -->
    <script src="./xterm.js"></script>
    <script src="./browser.js"></script>
  </body>
</html>
