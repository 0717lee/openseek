<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- interactive-widget makes Chrome shrink the layout viewport when the
         on-screen keyboard opens, so the flex shell compresses (topbar stays,
         composer sits above the keyboard) instead of the whole page panning
         up. Safari ignores the key. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content"
    />
    <title>SeekMoon</title>
    <script>
      // The native host overlays macOS window controls on this desktop entry.
      // Mark it before styles load so the first frame already reserves their
      // space; the separate browser-console entry keeps its ordinary layout.
      {
        const hostPlatform =
          navigator.userAgentData?.platform ||
          navigator.platform ||
          navigator.userAgent;
        if (hostPlatform.toLowerCase().includes("mac")) {
          document.documentElement.classList.add("macos-titlebar-overlay");
        }
      }
    </script>
    <!-- The embedded code viewer's styles, assembled from the editor dependency
         by the packager (see build_viewer_stylesheet). -->
    <link rel="stylesheet" href="viewer.css" />
    <!-- The app's own stylesheet, shared with the browser console page
         (frontend/browser/index.html). -->
    <link rel="stylesheet" href="app.css" />
    <link rel="stylesheet" href="xterm.css" />
  </head>
  <body>
    <div id="app"></div>
    <!-- The packager generates the xterm.js bundle and exposes its terminal
         constructor plus fit addon through the __openseek_xterm global. -->
    <script src="./xterm.js"></script>
    <script src="./frontend.js"></script>
  </body>
</html>
